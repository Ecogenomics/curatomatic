# Release a new version on every push to main, if the Conventional Commits since the last tag call for one (see
# "Releases" in AGENTS.md). The version, changelog and tag are made by semantic-release (`.releaserc.json`), then a static Linux
# binary is built from the tag and attached to the GitHub release, and the tag is merged into dev.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  SEMANTIC_RELEASE: >-
    npx --yes
    -p semantic-release@25
    -p @semantic-release/changelog@7
    -p @semantic-release/git@11
    -p @semantic-release/exec@7
    -p conventional-changelog-conventionalcommits@9
    semantic-release
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  # The checks of "Development" in AGENTS.md. If any fails, nothing is released.
  check:
    name: Check main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo nextest run --locked

  # Work out the next version from the commits since the last tag (empty if none is due).
  plan:
    name: Plan the release
    needs: check
    runs-on: ubuntu-latest
    # semantic-release checks that it can push to main, even in a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Dry run semantic-release
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $SEMANTIC_RELEASE --dry-run
          if [ -f .release-version ]; then
            echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"
          else
            echo "No release is due."
          fi

  # Set the version, write the changelog, commit and tag them on main, and create the GitHub release.
  release:
    name: Release
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # `cargo update --workspace --offline` (the prepare step in `.releaserc.json`) needs the registry cached.
      - run: cargo fetch --locked

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $SEMANTIC_RELEASE
          if [ -f .release-version ]; then
            version="$(cat .release-version)"
            git ls-remote --exit-code --tags origin "refs/tags/v${version}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "No release was made."
          fi

  # Build the static Linux binary from the tag, so it logs the released version, and attach it to the release.
  build:
    name: Build the Linux binary
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install musl and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary
        run: |
          bin="target/${TARGET}/release/curatomatic"
          linkage="$(file "$bin")"
          echo "$linkage"
          [[ "$linkage" == *"static"* ]]
          reported="$("$bin" --version)"
          echo "$reported"
          [[ "$reported" == "curatomatic ${VERSION}" ]]
          "$bin" --min-bs 95.0 \
            --taxonomy example/gtdb_r237_decorated_taxonomy.tsv \
            --prior-taxonomy example/gtdb_r232_bac120_taxonomy.tsv \
            --novel-name-file example/gtdb_r237_bac120_metadata_slim.tsv \
            --novel-accession db_name --novel-name-column ncbi_wgs_formatted \
            example/gtdb_r237_median_red_marked.nwk example/gtdb_r237_median_red_rank_distribution.tsv \
            "${RUNNER_TEMP}/example-output"
          grep -F "curatomatic v${VERSION} " "${RUNNER_TEMP}/example-output/curatomatic.log"

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="curatomatic-v${VERSION}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/curatomatic" README.md CHANGELOG.md LICENSE "$name/"
          tar czf "${name}.tar.gz" "$name"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          cat "${name}.tar.gz.sha256"
          gh release upload "v${VERSION}" "${name}.tar.gz" "${name}.tar.gz.sha256" --clobber

  # Merge the tag into dev, so dev has the version commit and the changelog. A conflict fails the job and pushes
  # nothing. It runs beside the build, so a failed build still leaves dev in sync.
  sync-dev:
    name: Merge the release into dev
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge and push
        run: |
          git config user.name "$GIT_COMMITTER_NAME"
          git config user.email "$GIT_COMMITTER_EMAIL"
          git fetch --no-tags origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git merge --no-ff --no-edit -m "chore(release): Merge v${VERSION} into dev" "v${VERSION}"
          git push origin HEAD:dev
